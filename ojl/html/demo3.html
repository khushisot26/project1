<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            padding: 20px;
            display: grid;
            grid-template-columns: 100px 100px 100px ;
            grid-template-rows: 50px 100px 40px  ;
            background-color:aquamarine;
            gap:2px;
            width:700px;
        }
        .item{
            background-color: cornflowerblue;
        
        }
        .item1{
            grid-column: 1/4;
            grid-row: 1/2;
            text-align: left;
            padding-left: 20px;
            padding-top: 15px;
        }
        .item2{
            grid-column: 1/2;
            grid-row: 2/4;
            padding-top: 50px;
            text-align: center;
        }
        .item3{
            grid-column: 2/4;
            grid-row: 2/3;
            text-align: center;
            padding-top: 40px;
        }
        .item4{
            grid-column: 2/4;
            grid-row: 3/4;
            text-align: center;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">Logo</div>
        <div class=" item item2">Sidebar</div>
        <div class=" item item3">Main</div>
        <div class=" item item4">Footer</div>
        

    </div>
</body>
</html>
